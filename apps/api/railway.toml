[build]
builder = "nixpacks"
buildCommand = "cd ../.. && npm ci && npx turbo run build --filter=@dcs/api..."

[deploy]
startCommand = "cd ../.. && npm run db:migrate:prod && node apps/api/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/v1/health"
